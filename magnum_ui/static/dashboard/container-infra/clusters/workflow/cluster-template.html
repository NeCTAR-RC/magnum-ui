<div ng-controller="horizon.dashboard.container-infra.clusters.workflow.clusterTemplateController as ctrl">
  <div class="detail" ng-show="ctrl.clusterTemplate.id">
    <span translate class="h4">Cluster Configuration</span>
    <dl class="dl-horizontal">
      <dt translate>Kubernetes Version</dt>
      <dd>{$ model.k8s_version|noValue $}</dd>
      <dt translate>Availability Zone</dt>
      <dd>{$ model.availability_zone|noValue $}</dd>
      <dt translate>Network Driver</dt>
      <dd>{$ model.network_driver|noValue $}</dd>
      <dt translate>Image</dt>
      <dd>{$ ctrl.clusterTemplate.image_id|noValue $}</dd>
    </dl>
  </div>
</div>
